services:
  - type: web
    name: rsi-bot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_ENV
        value: production
      - key: RENDER_URL
        value: https://trading-bot-kzt5.onrender.com
